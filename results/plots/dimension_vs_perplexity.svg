<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Fourier dimension versus validation perplexity</title><desc id="desc">Matched deterministic runs; lower perplexity and fewer parameters are better.</desc>
