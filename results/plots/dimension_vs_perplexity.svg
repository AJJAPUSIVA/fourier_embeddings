<text x="55" y="76" font-family="system-ui" font-size="14" fill="#475569">Matched deterministic runs; lower perplexity and fewer parameters are better.</text><circle cx="85.00" cy="218.71" r="7" fill="#2563eb"/><text x="85.00" y="205.71" text-anchor="middle" font-family="system-ui" font-size="12">D=128, 574.9</text><circle cx="192.14" cy="382.98" r="7" fill="#2563eb"/><text x="192.14" y="369.98" text-anchor="middle" font-family="system-ui" font-size="12">D=256, 565.2</text><circle cx="406.43" cy="149.23" r="7" fill="#2563eb"/><text x="406.43" y="136.23" text-anchor="middle" font-family="system-ui" font-size="12">D=512, 579.0</text><circle cx="835.00" cy="335.75" r="7" fill="#2563eb"/><text x="835.00" y="322.75" text-anchor="middle" font-family="system-ui" font-size="12">D=1024, 568.0</text><line x1="85" y1="410.77" x2="835" y2="410.77" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/><text x="830" y="402.77" text-anchor="end" font-family="system-ui" font-size="12">Kronecker 563.6</text><line x1="85" y1="450" x2="835" y2="450" stroke="#94a3b8"/><line x1="85" y1="110" x2="85" y2="450" stroke="#94a3b8"/><text x="460.0" y="500" text-anchor="middle" font-family="system-ui" font-size="14">Fourier dimension</text><text x="24" y="280.0" transform="rotate(-90 24 280.0)" text-anchor="middle" font-family="system-ui" font-size="14">Validation perplexity</text></svg>
