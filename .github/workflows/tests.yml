name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Run dependency-free mathematical tests
        run: python tests/test_math_reference.py -v

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify package imports
        run: |
          python -c "import fourier_embedding; print(fourier_embedding.__file__)"
          python -c "from fourier_embedding import FourierEmbedding"

      - name: Run test suite
        run: python -m pytest -q
